# fudan-zvg/4d-gaussian-splatting — quality config for 5.0s room physics scenes.
# Use for the stacking scene after the quick 1000-iteration smoke test.
# Paths are overwritten on Modal (/data/4d_scene, /outputs/4dgs_sphere_bounce).

gaussian_dim: 4
time_duration: [0.0, 5.0]
num_pts: 100_000
num_pts_ratio: 1.0
rot_4d: true
force_sh_3d: false
batch_size: 2
exhaust_test: false
test_iterations: [7000, 15000]
save_iterations: [7000, 15000]

ModelParams:
  sh_degree: 3
  source_path: "outputs/room_physics_12view"
  model_path: "outputs/4dgs_room_physics"
  images: "images"
  resolution: 1
  white_background: false
  data_device: "cuda"
  eval: true
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: true

PipelineParams:
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false
  env_map_res: 0
  env_optimize_until: 0
  env_optimize_from: 0
  eval_shfs_4d: true

OptimizationParams:
  iterations: 15_000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 15_000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 10_000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005
  densify_until_num_points: -1
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  lambda_motion: 0.0
